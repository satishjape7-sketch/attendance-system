name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: attendance
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: attendance_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U attendance -d attendance_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://attendance:test-password@localhost:5432/attendance_test
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: ../scripts/bootstrap-mobile.ps1
        shell: pwsh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=API_BASE_URL=https://attendance.example.com/api/v1
