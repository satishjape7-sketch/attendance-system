services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build: ./backend
    command: ["npm", "run", "migrate"]
    environment: &api_environment
      NODE_ENV: production
      DATABASE_URL: postgresql://attendance:${POSTGRES_PASSWORD}@db:5432/attendance
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in root .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Kolkata}
      TRUST_PROXY: "false"
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    restart: unless-stopped
    init: true
    environment: *api_environment
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  postgres_data:
