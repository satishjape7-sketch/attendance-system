name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'HTTPS backend URL including /api/v1'
        required: true
        type: string
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Validate backend URL
        shell: pwsh
        run: |
          $url = $null
          if (-not [Uri]::TryCreate($env:API_BASE_URL, [UriKind]::Absolute, [ref]$url) -or $url.Scheme -ne 'https' -or -not $url.AbsolutePath.EndsWith('/api/v1')) {
            throw 'Supply an HTTPS backend URL ending with /api/v1'
          }
      - name: Generate platform runners
        shell: pwsh
        run: ../scripts/bootstrap-mobile.ps1
      - run: flutter analyze
      - run: flutter test
      - name: Build installable debug APK
        shell: bash
        run: flutter build apk --debug --dart-define="API_BASE_URL=$API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
